<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">

        <div class="form-card">

            <h2>Login</h2>

            <p class="subtitle">
                Login to your student account
            </p>

            <form>

                <div class="input-group">
                    <label>Email / Username <span>*</span></label>
                    <input
                        type="text"
                        placeholder="Enter email or username"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Password <span>*</span></label>
                    <input
                        type="password"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Re-enter Password <span>*</span></label>
                    <input
                        type="password"
                        placeholder="Re-enter password"
                        required
                    >
                </div>

                <button type="submit" class="btn">
                    Login
                </button>

            </form>

           

            <a href="forgotpassword.html" class="forgot">
                Forgot Password?
            </a>

            <p class="login-text">
                New student?
                <a href="registration.html">Register Now</a>
            </p>

        </div>

    </div>

</body>
</html>
